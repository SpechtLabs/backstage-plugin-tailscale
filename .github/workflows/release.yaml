name: Release

# Changesets on main: while there are unreleased changesets, keep a release
# pull request open that bumps the versions and writes the changelogs;
# merging it publishes every package whose version isn't on npm yet, with
# provenance.
on:
  push:
    branches: [main]
  # For the first release, or to retry one.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write # the release commit and tags
  pull-requests: write # the release pull request
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: yarn install --immutable

      - name: Release pull request, or publish
        # Without an NPM_TOKEN (the repository secret), nothing to publish
        # with.
        if: env.NPM_TOKEN != ''
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: yarn version-packages
          publish: yarn release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Yarn publishes (yarn npm publish), with its own settings.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
