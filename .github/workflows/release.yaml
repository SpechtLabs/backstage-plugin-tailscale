name: Release

# Changesets on main: while there are unreleased changesets, keep a release
# pull request open that bumps the versions and writes the changelogs;
# merging it publishes every package whose version isn't on npm yet, with
# provenance.
on:
  push:
    branches: [main]
  # For the first release, or to retry one.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write # the release commit and tags
  pull-requests: write # the release pull request
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: corepack enable
      - run: yarn install --immutable

      - name: Release pull request, or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          # scripts/publish.mjs tags and makes the GitHub releases itself.
          push-git-tags: false
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Yarn publishes (yarn npm publish) through npm's trusted
          # publishing: with no token configured, it trades this job's OIDC
          # token for a short-lived npm one. Each package trusts this
          # repository's release.yaml on npmjs.com.
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
